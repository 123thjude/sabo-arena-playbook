<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - SABO ARENA</title>
  <link rel="icon" href="/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #f59e0b;
    }
    p {
      font-size: 16px;
      color: #9ca3af;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #f59e0b;
      color: #1a1a2e;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .btn:hover {
      background: #d97706;
      transform: translateY(-2px);
    }
    .logo {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/favicon.png" alt="SABO ARENA" class="logo">
    <h1>Bạn đang offline</h1>
    <p>
      Không có kết nối internet. Vui lòng kiểm tra kết nối mạng và thử lại.
    </p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">
      Thử lại
    </a>
  </div>
  <script>
    // Auto reload when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
